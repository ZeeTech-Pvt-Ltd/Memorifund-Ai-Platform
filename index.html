<!doctype html>
<html lang="en-AU">
  <head>
    <meta charset="UTF-8" />
    <!-- Brand mark. SVG first (crisp at any size), PNG + apple-touch-icon for
         browsers and iOS versions that don't take an SVG favicon. -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0B0A08" />
    <meta name="google-site-verification" content="H9lJqhLA0jRKL7jmzHG7UFEYm7PhgF6lOng_oO9BDGc" />

    <!-- Typography: Space Grotesk (headings) + Inter (body). Loaded
         non-blocking (media="print" swap) so the font CSS never blocks first
         paint / LCP; display=swap shows fallback text until webfonts arrive. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Space+Grotesk:wght@500;600;700&amp;display=swap"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Space+Grotesk:wght@500;600;700&amp;display=swap"
      />
    </noscript>


    <!-- Warm up third-party connections before the browser asks for them. -->
    <link rel="preconnect" href="https://flagcdn.com" crossorigin />
    <link rel="dns-prefetch" href="https://flagcdn.com" />

    <!-- Google Analytics (GA4). Placed after the preconnects and font CSS so
         it never competes with the LCP resources; `async` keeps it off the
         critical path either way. -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-86L5V9DC26"></script>
    <script>
      window.dataLayer = window.dataLayer || []
      function gtag() {
        dataLayer.push(arguments)
      }
      gtag('js', new Date())
      gtag('config', 'G-86L5V9DC26')
    </script>

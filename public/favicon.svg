<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" role="img" aria-label="Memorifund Ai Platform">
  <title>Memorifund Ai Platform</title>
  <defs>
    <linearGradient id="mfGold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F0D080"/>
      <stop offset=".55" stop-color="#D9B45A"/>
      <stop offset="1" stop-color="#B8913F"/>
    </linearGradient>
  </defs>
  <rect width="48" height="48" rx="14" fill="url(#mfGold)"/>
  <!-- M built from two candlesticks with a price line for the middle stroke.
       Strokes run slightly heavier than the in-page logo (3.6 -> 4.2) so the
       mark still reads at 16px in a browser tab. -->
  <g fill="#241503">
    <rect x="13.3" y="10.5" width="2.4" height="28" rx="1.2"/>
    <rect x="10.2" y="15.5" width="8.6" height="18" rx="2.8"/>
    <rect x="32.3" y="10.5" width="2.4" height="28" rx="1.2"/>
    <rect x="29.2" y="15.5" width="8.6" height="18" rx="2.8"/>
  </g>
  <path d="M14.5 17.5 24 29 33.5 17.5" fill="none" stroke="#241503" stroke-width="4.2" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
